name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Publish template previews
        if: github.event_name == 'push'
        working-directory: .
        run: |
          set -e
          mkdir -p /tmp/previews
          cp android/app/build/previews/*.png /tmp/previews/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan folio-previews-tmp
          git rm -rf --quiet .
          cp /tmp/previews/*.png .
          git add ./*.png
          git commit -q -m "Template previews for ${GITHUB_SHA::7}"
          git push -f origin HEAD:refs/heads/folio-previews
          git checkout -f "$GITHUB_SHA"

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: folio-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folio-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
