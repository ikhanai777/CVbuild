name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The Play upload key comes from repository secrets; without them the release build
      # falls back to the debug key and no .aab is produced.
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Publish template previews
        if: github.event_name == 'push'
        working-directory: .
        run: |
          set -e
          mkdir -p /tmp/previews
          cp android/app/build/previews/*.png /tmp/previews/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan folio-previews-tmp
          git rm -rf --quiet .
          cp /tmp/previews/*.png .
          git add ./*.png
          git commit -q -m "Template previews for ${GITHUB_SHA::7}"
          git push -f origin HEAD:refs/heads/folio-previews
          git checkout -f "$GITHUB_SHA"

      - name: Install the upload key
        if: github.event_name == 'push' && env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$UPLOAD_KEYSTORE_PASSWORD"
            echo "keyAlias=$UPLOAD_KEY_ALIAS"
            echo "keyPassword=$UPLOAD_KEY_PASSWORD"
          } > keystore.properties

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Check 16 KB page size support
        run: scripts/check-16kb.sh app/build/outputs/apk/release/app-release.apk

      - name: Build the signed Play bundle
        if: github.event_name == 'push' && env.HAS_UPLOAD_KEY == 'true'
        run: |
          ./gradlew --no-daemon bundleRelease
          scripts/check-16kb.sh app/build/outputs/bundle/release/app-release.aab

      - name: Upload the Play bundle
        if: github.event_name == 'push' && env.HAS_UPLOAD_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: folio-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: folio-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folio-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
